<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outside Counsel Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf8ff;
    --surface: #ffffff;
    --ink: #3b3552;
    --ink-soft: #6e6888;
    --line: #ebe5f5;
    --lavender: #e6dcff;
    --lavender-deep: #8a6fd6;
    --mint: #d6f5e8;
    --mint-deep: #2f9e74;
    --peach: #ffe3d6;
    --peach-deep: #d9714a;
    --sky: #d9ecff;
    --sky-deep: #3f7fc4;
    --butter: #fff4c7;
    --rose: #ffdbe6;
    --rose-deep: #c2456e;
    --radius: 16px;
    --shadow: 0 4px 18px rgba(110, 90, 170, .08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    background-image: radial-gradient(circle at 10% 0%, #f1e9ff 0, transparent 40%),
                      radial-gradient(circle at 95% 10%, #e3f6ef 0, transparent 35%);
    color: var(--ink);
    font: 15px/1.5 "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }

  header.top {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 48px; height: 48px; border-radius: 14px; background: var(--lavender);
    display: grid; place-items: center; font-size: 24px;
  }
  .brand h1 { margin: 0; font-size: 1.5rem; font-weight: 800; }
  .brand p { margin: 0; color: var(--ink-soft); font-size: .9rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }

  .btn {
    border: 0; border-radius: 12px; padding: 10px 16px; cursor: pointer; font-weight: 700;
    background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
    transition: transform .08s ease, background .15s ease;
  }
  .btn:hover { background: #f6f2ff; }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible, input:focus-visible, select:focus-visible, .chip:focus-visible {
    outline: 3px solid var(--lavender-deep); outline-offset: 2px;
  }
  .btn.primary { background: var(--lavender-deep); color: #fff; box-shadow: none; }
  .btn.primary:hover { background: #7a5fc8; }
  .btn.danger { background: var(--rose); color: var(--rose-deep); box-shadow: none; }
  .btn.small { padding: 6px 12px; font-size: .85rem; border-radius: 10px; }

  .search-panel {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px; display: grid; gap: 12px;
    grid-template-columns: 1fr 220px auto;
    align-items: end;
  }
  .field label { display: block; font-size: .8rem; font-weight: 700; color: var(--ink-soft); margin-bottom: 4px; }
  .search-box { position: relative; }
  .search-box span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: .6; }
  input[type=text], input[type=email], input[type=tel], input[type=search], select {
    width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: #fdfcff;
  }
  .search-box input { padding-left: 40px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 12px; }
  .stat {
    padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: .85rem;
  }
  .stat.a { background: var(--lavender); }
  .stat.b { background: var(--mint); }
  .stat.c { background: var(--peach); }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .card {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .card-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .card-head h2 { margin: 0 0 4px; font-size: 1.15rem; line-height: 1.3; }
  .tin { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--ink-soft); }
  .tin code { font-family: ui-monospace, Menlo, Consolas, monospace; background: var(--butter); padding: 1px 8px; border-radius: 6px; color: var(--ink); }
  .linkish { border: 0; background: none; padding: 0; color: var(--lavender-deep); cursor: pointer; font-weight: 700; font-size: .8rem; }
  .states { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .state-tag {
    background: var(--sky); color: var(--sky-deep); font-weight: 800; font-size: .75rem;
    padding: 2px 9px; border-radius: 999px; cursor: pointer; border: 0;
  }
  .state-tag:hover { filter: brightness(.96); }
  .contacts { display: grid; gap: 10px; padding: 14px 18px; flex: 1; }
  .contact { border-radius: 12px; padding: 10px 12px; }
  .contact.primary { background: #f3eeff; }
  .contact.billing { background: #ebfaf3; }
  .contact.it { background: #fff1ea; }
  .contact .role { font-size: .7rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .contact.primary .role { color: var(--lavender-deep); }
  .contact.billing .role { color: var(--mint-deep); }
  .contact.it .role { color: var(--peach-deep); }
  .contact .name { font-weight: 700; }
  .contact .meta { font-size: .85rem; color: var(--ink-soft); word-break: break-word; }
  .contact .meta a { color: inherit; }
  .contact .empty { font-size: .85rem; color: var(--ink-soft); font-style: italic; }
  .card-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 18px 16px; }

  .empty-state {
    text-align: center; padding: 48px 16px; background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); color: var(--ink-soft);
  }
  .empty-state .big { font-size: 40px; }
  mark { background: var(--butter); color: inherit; border-radius: 4px; padding: 0 2px; }

  /* Modal */
  dialog {
    border: 0; border-radius: 20px; padding: 0; width: min(760px, calc(100vw - 32px));
    max-height: calc(100vh - 32px); box-shadow: 0 20px 60px rgba(60, 40, 120, .25); color: var(--ink);
  }
  dialog::backdrop { background: rgba(60, 50, 90, .35); }
  .modal-head { padding: 18px 22px; background: var(--lavender); display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { margin: 0; }
  .modal-body { padding: 18px 22px; display: grid; gap: 18px; }
  .row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  fieldset { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px; margin: 0; }
  legend { font-weight: 800; padding: 0 6px; font-size: .9rem; }
  fieldset.primary legend { color: var(--lavender-deep); }
  fieldset.billing legend { color: var(--mint-deep); }
  fieldset.it legend { color: var(--peach-deep); }
  .contact-grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  .state-picker { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); max-height: 190px; overflow: auto; padding: 2px; }
  .chip {
    border: 0; border-radius: 10px; padding: 6px 0; cursor: pointer; font-weight: 800; font-size: .8rem;
    background: #f4f1fa; color: var(--ink-soft);
  }
  .chip[aria-pressed="true"] { background: var(--sky); color: var(--sky-deep); box-shadow: inset 0 0 0 2px #a9cdf2; }
  .picker-tools { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
  .hint { font-size: .8rem; color: var(--ink-soft); }
  .error { color: var(--rose-deep); font-size: .8rem; font-weight: 700; min-height: 1em; }
  .modal-foot { padding: 14px 22px 20px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); }
  .req { color: var(--rose-deep); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 12px; opacity: 0;
    transition: all .25s ease; pointer-events: none; font-weight: 700; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 760px) {
    .search-panel { grid-template-columns: 1fr; }
    .row, .contact-grid { grid-template-columns: 1fr; }
    .grid { grid-template-columns: 1fr; }
  }
  @media print {
    .actions, .search-panel, .card-foot, .linkish { display: none !important; }
    .card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">⚖️</div>
      <div>
        <h1>Outside Counsel Directory</h1>
        <p>Claims panel firms &amp; key contacts</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="addBtn">＋ Add firm</button>
      <button class="btn" id="exportCsvBtn" title="Download the directory as a spreadsheet">⬇ Export CSV</button>
      <button class="btn" id="backupBtn" title="Download a full backup file">💾 Backup</button>
      <button class="btn" id="restoreBtn" title="Load a backup file">📂 Restore</button>
      <input type="file" id="restoreFile" accept=".json,application/json" hidden>
    </div>
  </header>

  <section class="search-panel" aria-label="Search">
    <div class="field">
      <label for="q">Search by firm name or state</label>
      <div class="search-box">
        <span aria-hidden="true">🔍</span>
        <input type="search" id="q" placeholder="e.g. “Harbor”, “TX”, or “Texas”" autocomplete="off">
      </div>
    </div>
    <div class="field">
      <label for="stateFilter">Filter by state</label>
      <select id="stateFilter"><option value="">All states</option></select>
    </div>
    <button class="btn" id="clearBtn">Clear</button>
  </section>

  <div class="stats" id="stats"></div>
  <main id="results" class="grid" aria-live="polite"></main>
</div>

<dialog id="firmDialog" aria-labelledby="dlgTitle">
  <form id="firmForm" method="dialog" novalidate>
    <div class="modal-head">
      <h3 id="dlgTitle">Add firm</h3>
      <button type="button" class="btn small" id="closeDlg" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div class="row">
        <div class="field">
          <label for="f_name">Law firm name <span class="req">*</span></label>
          <input type="text" id="f_name" required>
        </div>
        <div class="field">
          <label for="f_tin">TIN <span class="req">*</span></label>
          <input type="text" id="f_tin" placeholder="12-3456789" inputmode="numeric" maxlength="10" required>
        </div>
      </div>

      <fieldset>
        <legend>States served <span class="req">*</span></legend>
        <div class="picker-tools">
          <span class="hint" id="stateCount">0 selected</span>
          <span>
            <button type="button" class="btn small" id="allStates">Select all</button>
            <button type="button" class="btn small" id="noStates">Clear</button>
          </span>
        </div>
        <div class="state-picker" id="statePicker"></div>
      </fieldset>

      <fieldset class="primary">
        <legend>Primary contact</legend>
        <div class="contact-grid" data-role="primary"></div>
      </fieldset>
      <fieldset class="billing">
        <legend>Billing contact</legend>
        <div class="contact-grid" data-role="billing"></div>
      </fieldset>
      <fieldset class="it">
        <legend>IT contact</legend>
        <div class="contact-grid" data-role="it"></div>
      </fieldset>
      <div class="error" id="formError" role="alert"></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn" id="cancelDlg">Cancel</button>
      <button type="submit" class="btn primary" id="saveBtn">Save firm</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const STORAGE_KEY = "outsideCounselDirectory.v1";

  const STATES = {
    AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",
    DE:"Delaware",DC:"District of Columbia",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",
    IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",
    MI:"Michigan",MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",
    NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",
    OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",
    TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",
    WI:"Wisconsin",WY:"Wyoming",PR:"Puerto Rico"
  };
  const CODES = Object.keys(STATES);
  const ROLES = [
    { key: "primary", label: "Primary contact" },
    { key: "billing", label: "Billing contact" },
    { key: "it",      label: "IT contact" }
  ];

  // Sample entries (fictional) so the page isn't empty on first open. Delete or edit freely.
  const SAMPLE = [
    { name: "Harborview Claims Defense LLP", tin: "00-0000101", states: ["CA","OR","WA"],
      primary: { name: "Dana Whitfield", title: "Partner", email: "dwhitfield@example.com", phone: "(555) 010-1100" },
      billing: { name: "Marcus Lee", title: "Billing Manager", email: "billing@example.com", phone: "(555) 010-1101" },
      it:      { name: "Priya Shah", title: "IT Director", email: "it@example.com", phone: "(555) 010-1102" } },
    { name: "Lone Star Insurance Litigation PC", tin: "00-0000202", states: ["TX","OK","LA","NM"],
      primary: { name: "Robert Alvarez", title: "Managing Partner", email: "ralvarez@example.com", phone: "(555) 020-2200" },
      billing: { name: "Tina Brooks", title: "AR Specialist", email: "ar@example.com", phone: "(555) 020-2201" },
      it:      { name: "", title: "", email: "helpdesk@example.com", phone: "" } },
    { name: "Bluegrass & Hollow Attorneys", tin: "00-0000303", states: ["KY","TN","OH","IN"],
      primary: { name: "Ellen Carter", title: "Partner", email: "ecarter@example.com", phone: "(555) 030-3300" },
      billing: { name: "Sam Ortiz", title: "Controller", email: "sortiz@example.com", phone: "(555) 030-3301" },
      it:      { name: "Jordan Kim", title: "Systems Admin", email: "jkim@example.com", phone: "(555) 030-3302" } },
    { name: "Atlantic Coverage Counsel", tin: "00-0000404", states: ["NY","NJ","CT","PA","FL"],
      primary: { name: "Michael Romano", title: "Senior Partner", email: "mromano@example.com", phone: "(555) 040-4400" },
      billing: { name: "Grace Liu", title: "Billing Coordinator", email: "gliu@example.com", phone: "(555) 040-4401" },
      it:      { name: "Chris Patel", title: "IT Manager", email: "cpatel@example.com", phone: "(555) 040-4402" } }
  ];

  const $ = (s, r = document) => r.querySelector(s);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  // ---------- storage ----------
  let firms = load();
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed.map(normalize);
      }
    } catch (e) { /* storage unavailable; fall through to sample data */ }
    return SAMPLE.map(f => normalize({ ...f, id: uid() }));
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(firms)); }
    catch (e) { toast("Couldn't save in this browser — use Backup to keep a copy."); }
  }
  function normalize(f) {
    const c = (x) => ({ name: x?.name || "", title: x?.title || "", email: x?.email || "", phone: x?.phone || "" });
    return {
      id: f.id || uid(),
      name: String(f.name || "").trim(),
      tin: String(f.tin || "").trim(),
      states: Array.isArray(f.states) ? f.states.filter(s => STATES[s]).sort() : [],
      primary: c(f.primary), billing: c(f.billing), it: c(f.it)
    };
  }

  // ---------- search ----------
  const q = $("#q"), stateFilter = $("#stateFilter");
  CODES.slice().sort((a, b) => STATES[a].localeCompare(STATES[b])).forEach(code => {
    stateFilter.add(new Option(`${STATES[code]} (${code})`, code));
  });

  // Returns state codes a query refers to: an exact 2-letter code, or full names starting with the query.
  function statesMatching(term) {
    const t = term.toLowerCase();
    const out = new Set();
    if (t.length === 2 && STATES[t.toUpperCase()]) out.add(t.toUpperCase());
    if (t.length >= 3) CODES.forEach(c => { if (STATES[c].toLowerCase().startsWith(t)) out.add(c); });
    return out;
  }

  function filtered() {
    const term = q.value.trim();
    const st = stateFilter.value;
    const matchStates = term ? statesMatching(term) : new Set();
    return firms
      .filter(f => !st || f.states.includes(st))
      .filter(f => {
        if (!term) return true;
        if (f.name.toLowerCase().includes(term.toLowerCase())) return true;
        return f.states.some(s => matchStates.has(s));
      })
      .sort((a, b) => a.name.localeCompare(b.name));
  }

  function highlight(text, term) {
    const safe = esc(text);
    if (!term) return safe;
    const re = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/[&<>"']/g, c => esc(c)) + ")", "ig");
    return safe.replace(re, "<mark>$1</mark>");
  }

  // ---------- render ----------
  const revealed = new Set();
  function maskTin(tin) {
    const digits = tin.replace(/\D/g, "");
    return digits.length >= 4 ? "••-•••" + digits.slice(-4) : "••••";
  }

  function contactHtml(role, c) {
    const has = c.name || c.email || c.phone;
    return `<div class="contact ${role.key}">
      <div class="role">${role.label}</div>
      ${has ? `
        ${c.name ? `<div class="name">${esc(c.name)}${c.title ? ` <span class="meta">· ${esc(c.title)}</span>` : ""}</div>` : ""}
        ${c.email ? `<div class="meta">✉️ <a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div>` : ""}
        ${c.phone ? `<div class="meta">📞 <a href="tel:${esc(c.phone.replace(/[^\d+]/g, ""))}">${esc(c.phone)}</a></div>` : ""}
      ` : `<div class="empty">Not provided</div>`}
    </div>`;
  }

  function render() {
    const list = filtered();
    const term = q.value.trim();
    const matchStates = term ? statesMatching(term) : new Set();
    const coveredStates = new Set(firms.flatMap(f => f.states));

    $("#stats").innerHTML = `
      <span class="stat a">${firms.length} firm${firms.length === 1 ? "" : "s"}</span>
      <span class="stat b">${coveredStates.size} state${coveredStates.size === 1 ? "" : "s"} covered</span>
      ${(term || stateFilter.value) ? `<span class="stat c">${list.length} match${list.length === 1 ? "" : "es"}</span>` : ""}`;

    const box = $("#results");
    if (!list.length) {
      box.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <div class="big">🌸</div>
        <p><strong>${firms.length ? "No firms match your search." : "No firms yet."}</strong></p>
        <p>${firms.length ? "Try a different name or state, or clear the filters." : "Click “Add firm” to get started."}</p>
      </div>`;
      return;
    }

    box.innerHTML = list.map(f => `
      <article class="card" data-id="${f.id}">
        <div class="card-head">
          <h2>${highlight(f.name, term)}</h2>
          <div class="tin">TIN <code>${esc(revealed.has(f.id) ? f.tin : maskTin(f.tin))}</code>
            <button class="linkish" data-act="reveal">${revealed.has(f.id) ? "Hide" : "Show"}</button>
            <button class="linkish" data-act="copy">Copy</button>
          </div>
          <div class="states">${f.states.map(s =>
            `<button class="state-tag" data-state="${s}" title="${esc(STATES[s])} — show all firms here"
              ${(matchStates.has(s) || stateFilter.value === s) ? 'style="background:#ffe08a;color:#7a5a00"' : ""}>${s}</button>`
          ).join("")}</div>
        </div>
        <div class="contacts">${ROLES.map(r => contactHtml(r, f[r.key])).join("")}</div>
        <div class="card-foot">
          <button class="btn small" data-act="edit">✏️ Edit</button>
          <button class="btn small danger" data-act="delete">🗑 Delete</button>
        </div>
      </article>`).join("");
  }

  $("#results").addEventListener("click", async (e) => {
    const tag = e.target.closest(".state-tag");
    if (tag) { stateFilter.value = tag.dataset.state; q.value = ""; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const id = btn.closest(".card").dataset.id;
    const firm = firms.find(f => f.id === id);
    if (!firm) return;
    switch (btn.dataset.act) {
      case "reveal": revealed.has(id) ? revealed.delete(id) : revealed.add(id); render(); break;
      case "copy":
        try { await navigator.clipboard.writeText(firm.tin); toast("TIN copied"); }
        catch { toast("Copy not allowed here — use Show instead"); }
        break;
      case "edit": openForm(firm); break;
      case "delete":
        if (confirm(`Delete “${firm.name}” from the directory?`)) {
          firms = firms.filter(f => f.id !== id); save(); render(); toast("Firm deleted");
        }
        break;
    }
  });

  q.addEventListener("input", render);
  stateFilter.addEventListener("change", render);
  $("#clearBtn").addEventListener("click", () => { q.value = ""; stateFilter.value = ""; render(); q.focus(); });

  // ---------- form ----------
  const dlg = $("#firmDialog"), form = $("#firmForm");
  let editingId = null;
  const picked = new Set();

  document.querySelectorAll(".contact-grid").forEach(g => {
    const r = g.dataset.role;
    g.innerHTML = `
      <div class="field"><label for="${r}_name">Name</label><input type="text" id="${r}_name"></div>
      <div class="field"><label for="${r}_title">Title</label><input type="text" id="${r}_title"></div>
      <div class="field"><label for="${r}_email">Email</label><input type="email" id="${r}_email"></div>
      <div class="field"><label for="${r}_phone">Phone</label><input type="tel" id="${r}_phone"></div>`;
  });

  const picker = $("#statePicker");
  picker.innerHTML = CODES.map(c => `<button type="button" class="chip" data-code="${c}" aria-pressed="false" title="${STATES[c]}">${c}</button>`).join("");
  picker.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip"); if (!chip) return;
    const c = chip.dataset.code;
    picked.has(c) ? picked.delete(c) : picked.add(c);
    syncPicker();
  });
  $("#allStates").addEventListener("click", () => { CODES.forEach(c => picked.add(c)); syncPicker(); });
  $("#noStates").addEventListener("click", () => { picked.clear(); syncPicker(); });
  function syncPicker() {
    picker.querySelectorAll(".chip").forEach(ch => ch.setAttribute("aria-pressed", picked.has(ch.dataset.code)));
    $("#stateCount").textContent = `${picked.size} selected`;
  }

  // Auto-format TIN as XX-XXXXXXX while typing.
  $("#f_tin").addEventListener("input", (e) => {
    const d = e.target.value.replace(/\D/g, "").slice(0, 9);
    e.target.value = d.length > 2 ? d.slice(0, 2) + "-" + d.slice(2) : d;
  });

  function openForm(firm) {
    editingId = firm ? firm.id : null;
    $("#dlgTitle").textContent = firm ? "Edit firm" : "Add firm";
    $("#formError").textContent = "";
    $("#f_name").value = firm?.name || "";
    $("#f_tin").value = firm?.tin || "";
    picked.clear(); (firm?.states || []).forEach(s => picked.add(s)); syncPicker();
    ROLES.forEach(({ key }) => ["name", "title", "email", "phone"].forEach(k => {
      $(`#${key}_${k}`).value = firm?.[key]?.[k] || "";
    }));
    dlg.showModal();
    $("#f_name").focus();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("#f_name").value.trim();
    const tin = $("#f_tin").value.trim();
    const err = $("#formError");
    if (!name) { err.textContent = "Please enter the law firm name."; $("#f_name").focus(); return; }
    if (!/^\d{2}-\d{7}$/.test(tin)) { err.textContent = "TIN must be 9 digits (format 12-3456789)."; $("#f_tin").focus(); return; }
    if (firms.some(f => f.tin === tin && f.id !== editingId)) { err.textContent = "Another firm already uses this TIN."; $("#f_tin").focus(); return; }
    if (!picked.size) { err.textContent = "Pick at least one state."; return; }
    for (const { key, label } of ROLES) {
      const em = $(`#${key}_email`);
      if (em.value.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim())) {
        err.textContent = `${label}: email address looks incomplete.`; em.focus(); return;
      }
    }
    const record = normalize({
      id: editingId || uid(), name, tin, states: [...picked],
      ...Object.fromEntries(ROLES.map(({ key }) => [key, {
        name: $(`#${key}_name`).value.trim(), title: $(`#${key}_title`).value.trim(),
        email: $(`#${key}_email`).value.trim(), phone: $(`#${key}_phone`).value.trim()
      }]))
    });
    if (editingId) firms = firms.map(f => f.id === editingId ? record : f);
    else firms.push(record);
    save(); dlg.close(); render();
    toast(editingId ? "Firm updated" : "Firm added");
  });

  $("#addBtn").addEventListener("click", () => openForm(null));
  $("#closeDlg").addEventListener("click", () => dlg.close());
  $("#cancelDlg").addEventListener("click", () => dlg.close());

  // ---------- export / backup ----------
  function download(filename, content, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([content], { type }));
    a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  const stamp = () => new Date().toISOString().slice(0, 10);

  $("#exportCsvBtn").addEventListener("click", () => {
    const list = filtered();
    const cols = ["Law Firm", "TIN", "States"];
    ROLES.forEach(r => ["Name", "Title", "Email", "Phone"].forEach(k => cols.push(`${r.label} ${k}`)));
    // Prefix risky leading characters so spreadsheet apps don't treat values as formulas.
    const cell = (v) => { let s = String(v ?? ""); if (/^[=+\-@]/.test(s) && !/^\d{2}-\d{7}$/.test(s)) s = "'" + s; return `"${s.replace(/"/g, '""')}"`; };
    const rows = list.map(f => [f.name, f.tin, f.states.join(", "),
      ...ROLES.flatMap(r => ["name", "title", "email", "phone"].map(k => f[r.key][k]))]);
    download(`outside-counsel-directory-${stamp()}.csv`, "\ufeff" + [cols, ...rows].map(r => r.map(cell).join(",")).join("\r\n"), "text/csv");
    toast(`Exported ${list.length} firm${list.length === 1 ? "" : "s"}`);
  });

  $("#backupBtn").addEventListener("click", () => {
    download(`outside-counsel-backup-${stamp()}.json`, JSON.stringify(firms, null, 2), "application/json");
  });
  $("#restoreBtn").addEventListener("click", () => $("#restoreFile").click());
  $("#restoreFile").addEventListener("change", async (e) => {
    const file = e.target.files[0]; e.target.value = "";
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data)) throw new Error("not a list");
      if (!confirm(`Replace the current directory (${firms.length} firms) with ${data.length} firms from this backup?`)) return;
      firms = data.map(normalize).filter(f => f.name); save(); render(); toast("Backup restored");
    } catch { toast("That file isn't a valid directory backup"); }
  });

  // ---------- toast ----------
  let toastTimer;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT" && !dlg.open) { e.preventDefault(); q.focus(); }
  });

  render();
})();
</script>
</body>
</html>
